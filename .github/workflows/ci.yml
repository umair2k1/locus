name: CI

on:
  push:
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Make scripts executable
        run: chmod +x gradlew scripts/import-hygiene.sh

      - name: Spotless check
        run: ./gradlew spotlessCheck

      - name: Import hygiene check
        run: ./scripts/import-hygiene.sh

      - name: Detekt static analysis
        run: ./gradlew detekt

      - name: Assemble OSS and Full Debug
        run: ./gradlew :app:assembleOssDebug :app:assembleFullDebug

      - name: Run domain unit tests
        run: ./gradlew :core:domain:test

      - name: Run data unit tests
        run: ./gradlew :core:data:test

      - name: Run AI unit tests
        run: ./gradlew :core:ai:test

      - name: Run app and remaining unit tests
        run: ./gradlew test
